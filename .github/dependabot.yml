version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The custom linter uses the TypeScript compiler API; major upgrades need migration.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Keep type declarations aligned with the Node 22/24 runtime support matrix.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
